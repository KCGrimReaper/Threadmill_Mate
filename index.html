<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threadmill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#070807;font-family:Barlow,system-ui,sans-serif;color:#F2F4EE;-webkit-tap-highlight-color:transparent}
  *{box-sizing:border-box}
  button{font-family:Barlow;cursor:pointer;border:none}
  input{font-family:Barlow}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:#101110;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .stepbtn:active{filter:brightness(1.15)}
  #ui{display:contents}
  #vbox{position:absolute;display:none;background:#000;border-radius:16px;overflow:hidden;z-index:5}
  #vbox video{width:100%;height:100%;object-fit:cover;display:block}
  #vbox.full{position:fixed;inset:0;border-radius:0;z-index:40}
  #vbox.full video{object-fit:contain}
</style>
</head>
<body>
<div id="app"><div id="ui"></div><div id="vbox" onclick="if(!st.vfull)toggleVideoFull()"><video id="tmv" playsinline muted preload="auto"></video><div id="vhud"></div><div id="vcfg"></div></div></div>
<input type="file" id="gpxFile" accept=".gpx" style="display:none">
<input type="file" id="vidFile" accept="video/mp4,.mp4,.MP4,.mov,.MOV" multiple style="display:none">
<script src="firebase-config.js"></script>
<script src="gopro.js"></script>
<script>
const FTMS=0x1826, DATA=0x2acd, CONTROL=0x2ad9, SPD_RANGE=0x2ad4, INC_RANGE=0x2ad5;
const HR_SVC=0x180d, HR_MEAS=0x2a37, SENT=0x7fff, GPX_SEG=50;
const DIM='#23261e', PAST='#4c5142', ACC='#CBF24E';
const STEP=0.1;

let st={ view:'drive', connected:false, hrOn:false, speed:0, incReal:0, mainUnit:'kmh', dist:0, dplus:0, elapsed:0, hr:0,
  spdT:9.5, incT:4, grades:[], speeds:[], sessions:[], history:[], strava:null, pubId:null, shapePick:null, draft:null, buildErr:'', msg:'', msgColor:'#8A8F80',
  play:null, sheet:false, vidSheet:null, vfull:false, cloud:window.TM_FIREBASE_CONFIG?'syncing':'off', cloudInfo:'', user:null };
let spdMin=1, spdMax=18, incMin=0, incMax=15;
let device=null, controlChar=null, hrDevice=null, wakeLock=null;
let rec=[], activeRoute=null, gattQueue=Promise.resolve(), lastTs=0, curGrade=0;
let selMode={hist:false,sess:false}, selSet={hist:new Set(),sess:new Set()}, renaming=null;
let knownTm=null, knownHr=null, freeStarted=false, freeReaching=false, lastTickAt=0;

// ---------- utils ----------
function loadLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }
function persist(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function fmt(t){ t=Math.max(0,Math.round(t)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return h? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') : m+':'+String(s).padStart(2,'0'); }
function totals(segs){ let dur=0,dist=0,dp=0; segs.forEach(s=>{ dur+=s.dur; const m=(s.spd/3.6)*s.dur; dist+=m; if(s.inc>0) dp+=m*s.inc/100; }); return {dur,dist:Math.round(dist),dp:Math.round(dp)}; }
function num(v){ const n=parseFloat(String(v||'').replace(',','.')); return isNaN(n)?0:n; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function clamp(v,a,b){ return Math.min(b,Math.max(a,v)); }

// ---------- BLE ----------
async function setupTreadmill(dev){
  sim=false; simBelt=false; device=dev;
  device.addEventListener('gattserverdisconnected', ()=>{ archiveRun(); st.connected=false; render(); });
  const server=await device.gatt.connect();
  const svc=await server.getPrimaryService(FTMS);
  const dataCh=await svc.getCharacteristic(DATA);
  await dataCh.startNotifications();
  dataCh.addEventListener('characteristicvaluechanged', e=>parseData(e.target.value));
  controlChar=await svc.getCharacteristic(CONTROL);
  await controlChar.startNotifications();
  await readRanges(svc);
  await sendControl([0x00]); sendControl([0x07]);
  st.connected=true; st.dist=0; st.dplus=0; st.elapsed=0; rec=[]; st.sheet=false;
  try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
  try{ localStorage.setItem('tm_tmid', device.id); }catch(e){}
  render();
}
async function connect(){
  if(!navigator.bluetooth){ st.msg='Web Bluetooth requis (Chrome, HTTPS/localhost).'; st.msgColor='#FF7A6B'; render(); return; }
  try{ const dev=await navigator.bluetooth.requestDevice({filters:[{services:[FTMS]}], optionalServices:[FTMS,0xfff0]}); await setupTreadmill(dev); }
  catch(err){ st.msg='Connexion : '+err.message; st.msgColor='#FF7A6B'; render(); }
}
function connectSmart(){ if(knownTm){ setupTreadmill(knownTm).catch(()=>connect()); } else connect(); }
function fmtPace(minPerU){ if(!isFinite(minPerU)||minPerU<=0) return '—'; const s=Math.round(minPerU*60); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
// vitesse km-effort instantanée : v*(1 + pente%/10). Ex : 10 km/h à 10% = 20 km-effort/h.
function metrics(sp, grade){ const g=grade>0?grade:0; const vkt= sp>0 ? sp*(1+g/10) : 0;
  return { kmh:sp, minkm: sp>0?60/sp:0, vkt, minkme: vkt>0?60/vkt:0 }; }
function heroValue(){ const m=metrics(st.speed, st.incReal), u=st.mainUnit;
  if(u==='minkm') return {big:fmtPace(m.minkm), unit:'/km', label:'ALLURE'};
  if(u==='vkt') return {big:m.vkt.toFixed(1), unit:'km-e/h', label:'VITESSE EFFORT'};
  return {big:m.kmh.toFixed(1), unit:'km/h', label:'VITESSE RÉELLE'}; }
function subMetrics(){ const m=metrics(st.speed, st.incReal), u=st.mainUnit, p=[];
  if(u!=='kmh') p.push(m.kmh.toFixed(1)+' km/h');
  if(u!=='minkm') p.push(fmtPace(m.minkm)+' /km');
  if(u!=='vkt') p.push(m.vkt.toFixed(1)+' km-e/h');
  return p.join('  ·  '); }
function cycleUnit(){ const o=['kmh','minkm','vkt'], i=o.indexOf(st.mainUnit); st.mainUnit=o[(i+1)%3]; try{localStorage.setItem('tm_unit',st.mainUnit);}catch(e){} settingsChanged('unit'); render(); }
function paces(sp, dist, dplus){ return subMetrics(); }
async function reconnectTm(){ if(knownTm){ try{ await setupTreadmill(knownTm); }catch(e){} } }
// ---------- simulation (sans tapis) : pour essayer les séances et la vidéo ; la courroie se lance d'un bouton ----------
// En simulation, l'heure des mesures vient d'une horloge simulée (1 s par pas, départ 3 h plus tôt) : en accéléré (×10),
// la course enregistrée garde des temps réalistes et reste dans le passé (Strava refuse les activités dans le futur).
let sim=false, simBelt=false, simFast=false, simRecord=false, simClock=0;
function clockIso(){ if(sim){ simClock+=1000; return new Date(simClock).toISOString(); } return new Date().toISOString(); }
function simToggle(){ sim=!sim; simBelt=false; simFast=false; st.speed=0; st.incReal=0; curGrade=0; simClock=Date.now()-3*3600*1000;
  if(sim){ if(device&&device.gatt.connected) device.gatt.disconnect(); spdMin=1; spdMax=18; incMin=0; incMax=15; st.connected=true; st.dist=0; st.dplus=0; st.elapsed=0; rec=[]; st.sheet=false; }
  else st.connected=false;
  render(); }
function simBeltToggle(){ simBelt=!simBelt; st.speed=simBelt?clamp(st.spdT,spdMin,spdMax):0; render(); }
function simBar(){ if(!sim) return '';
  return '<div style="margin:0 18px 8px;display:flex;align-items:center;gap:10px;background:rgba(232,197,71,.1);border:1px solid #5a4d1c;border-radius:14px;padding:9px 12px">'+
    '<span style="flex:1;font:600 12.5px Barlow;color:#E8C547;line-height:1.35">Simulation sans tapis<br><span style="font-weight:500;color:#a99a5c">'+(simRecord?'enregistrée « [Test] » dans l\'historique':'rien n\'est enregistré')+'</span></span>'+
    '<button onclick="simBeltToggle()" style="background:'+(simBelt?'#23261e':'#E8C547')+';border-radius:10px;padding:9px 12px;font:600 13px Barlow;color:'+(simBelt?'#FF7A6B':'#14170a')+'">'+(simBelt?'Arrêter la courroie':'Lancer la courroie')+'</button></div>'+
    '<div style="margin:0 18px 8px;display:flex;gap:8px">'+
    '<button onclick="simFast=!simFast;render()" style="flex:1;background:'+(simFast?'rgba(232,197,71,.18)':'#191b18')+';border:1px solid '+(simFast?'#E8C547':'#26291f')+';border-radius:12px;padding:9px;font:600 12.5px Barlow;color:'+(simFast?'#E8C547':'#C3C8B8')+'">Accéléré ×10</button>'+
    '<button onclick="simRecord=!simRecord;render()" style="flex:1.4;background:'+(simRecord?'rgba(232,197,71,.18)':'#191b18')+';border:1px solid '+(simRecord?'#E8C547':'#26291f')+';border-radius:12px;padding:9px;font:600 12.5px Barlow;color:'+(simRecord?'#E8C547':'#C3C8B8')+'">Enregistrer (tester Strava)</button></div>'; }
function disconnect(){ if(sim){ simToggle(); return; } if(device&&device.gatt.connected) device.gatt.disconnect(); st.connected=false; render(); }
async function readRanges(svc){
  try{ const d=await (await svc.getCharacteristic(SPD_RANGE)).readValue(); spdMin=d.getUint16(0,true)*0.01; spdMax=d.getUint16(2,true)*0.01; }catch(e){}
  try{ const d=await (await svc.getCharacteristic(INC_RANGE)).readValue(); incMin=d.getInt16(0,true)*0.1; incMax=d.getInt16(2,true)*0.1; }catch(e){}
}
async function setupHr(dev){
  hrDevice=dev;
  hrDevice.addEventListener('gattserverdisconnected', ()=>{ st.hrOn=false; st.hr=0; render(); });
  const s=await hrDevice.gatt.connect();
  const ch=await (await s.getPrimaryService(HR_SVC)).getCharacteristic(HR_MEAS);
  await ch.startNotifications();
  ch.addEventListener('characteristicvaluechanged', e=>{ const dv=e.target.value,f=dv.getUint8(0); st.hr=(f&1)?dv.getUint16(1,true):dv.getUint8(1); render(); });
  st.hrOn=true; try{ localStorage.setItem('tm_hrid', hrDevice.id); }catch(e){} render();
}
async function pairHr(){
  if(!navigator.bluetooth) return;
  if(knownHr && !st.hrOn){ try{ await setupHr(knownHr); return; }catch(e){} }
  try{ const dev=await navigator.bluetooth.requestDevice({filters:[{services:[HR_SVC]}]}); await setupHr(dev); }
  catch(err){ st.msg='Cardio : '+err.message; st.msgColor='#FF7A6B'; render(); }
}
async function loadKnown(){
  try{ if(!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
    const ds=await navigator.bluetooth.getDevices();
    const tmId=localStorage.getItem('tm_tmid'), hrId=localStorage.getItem('tm_hrid');
    knownTm=ds.find(d=>d.id===tmId)||null; knownHr=ds.find(d=>d.id===hrId)||null; render();
    if(knownTm) reconnectTm(); if(knownHr && !st.hrOn){ try{ await setupHr(knownHr); }catch(e){} }
  }catch(e){}
}
function sendControl(bytes){ if(!controlChar) return Promise.resolve();
  gattQueue=gattQueue.then(async()=>{ try{ await controlChar.writeValueWithResponse(new Uint8Array(bytes)); }catch(e){} }); return gattQueue; }
function sendSpeed(v){ v=clamp(v,spdMin,spdMax); if(sim){ if(simBelt) st.speed=v; return Promise.resolve(); } const r=Math.round(v*100); return sendControl([0x02,r&0xff,(r>>8)&0xff]); }
function sendIncline(v){ v=clamp(v,incMin,incMax); if(sim){ st.incReal=curGrade=v; return Promise.resolve(); } const b=new ArrayBuffer(3),dv=new DataView(b); dv.setUint8(0,0x03); dv.setInt16(1,Math.round(v*10),true); return sendControl([...new Uint8Array(b)]); }
function parseData(dv){
  let o=0; const flags=dv.getUint16(o,true); o+=2; const has=b=>(flags&(1<<b))!==0; const out={};
  if(!has(0)){ out.speed=dv.getUint16(o,true)*0.01; o+=2; }
  if(has(1)) o+=2; if(has(2)) o+=3;
  if(has(3)){ const i=dv.getInt16(o,true); o+=4; out.incline=(i===SENT)?null:i*0.1; }
  if(out.speed!=null) st.speed=out.speed;
  if(out.incline!=null){ curGrade=out.incline; st.incReal=out.incline; }
}

// ---------- réglages ----------
function adjSpd(d){ if(st.play&&st.play.type==='gpx'&&st.play.mode==='gpx') st.play.mode='free';   // + / − : on reprend la main sur l'allure du GPX
  const v=clamp(+(st.spdT+d).toFixed(1),spdMin,spdMax); st.spdT=v; sendSpeed(v); if(!st.play) freeReaching=true; render(); }
function adjInc(d){ const v=clamp(+(st.incT+d).toFixed(1),incMin,incMax); st.incT=v; sendIncline(v); render(); }

// ---------- séances ----------
function newSession(){ st.view='build'; st.buildErr=''; st.draft={id:'s'+Date.now(),type:'interval',name:'',segments:[{name:'Échauffement',dur:600,spd:8,inc:1},{name:'Bloc',dur:120,spd:10,inc:6}]}; render(); }
function editSession(id){ const s=st.sessions.find(x=>x.id===id); if(!s) return; st.view='build'; st.buildErr=''; st.draft=JSON.parse(JSON.stringify(s)); render(); }
function saveSession(){ const d=st.draft;
  if(!(d.name||'').trim()){ st.buildErr='Donne un nom à la séance.'; render(); return; }
  if(!d.segments.length){ st.buildErr='Ajoute au moins un bloc.'; render(); return; }
  const arr=st.sessions.slice(); const i=arr.findIndex(x=>x.id===d.id); if(i>=0) arr[i]=d; else arr.push(d);
  cloudPut('sessions',d); persist('tm_sessions',arr); st.sessions=arr; st.view='sessions'; st.draft=null; st.msg='Séance enregistrée.'; st.msgColor=ACC; render(); }
function delSession(id){ st.sessions=st.sessions.filter(x=>x.id!==id); persist('tm_sessions',st.sessions); cloudDel('sessions',id); render(); }
function mutDraft(fn){ fn(st.draft); render(); }
function segEdit(i,field,val){ const d=st.draft;
  if(field==='name') d.segments[i].name=val;
  else if(field==='min'){ const v=parseInt(val||'0',10)||0; d.segments[i].dur=v*60+d.segments[i].dur%60; }
  else if(field==='sec'){ const v=parseInt(val||'0',10)||0; d.segments[i].dur=Math.floor(d.segments[i].dur/60)*60+v; }
  else if(field==='spd') d.segments[i].spd=num(val);
  else if(field==='inc') d.segments[i].inc=num(val);
  render(); }
function segDup(i){ mutDraft(d=>d.segments.splice(i+1,0,JSON.parse(JSON.stringify(d.segments[i])))); }
function segDel(i){ mutDraft(d=>d.segments.splice(i,1)); }
function segAdd(){ mutDraft(d=>{ const l=d.segments[d.segments.length-1]||{spd:9,inc:2}; d.segments.push({name:'',dur:120,spd:l.spd,inc:l.inc}); }); }
function draftNameSet(v){ st.draft.name=v; }

function launch(id){ const s=st.sessions.find(x=>x.id===id); if(!s) return;
  rec=[]; activeRoute = s.track&&s.track.length>1 ? s.track : null;
  const play = s.type==='gpx' ? {type:'gpx',session:s,mode:s.hasTime?'gpx':'free',started:false,paused:false,offset:0}
    : {type:'interval',session:s,idx:0,segElapsed:0,started:false,paused:false};
  const first = s.type==='gpx' ? s.segs[0] : s.segments[0];
  st.play=play; st.view='play'; st.dist=0; st.dplus=0; st.elapsed=0; st.grades=[]; st.speeds=[];
  st.spdT = s.type==='gpx' ? (first.spd||st.spdT) : first.spd;
  st.incT = s.type==='gpx' ? first.grade : first.inc;
  sendControl([0x07]); st.vfull=false; st.hudRun=null; if(s.video) restoreVideo(s); render();
  if(s.type==='gpx' && s.video && vfullStart()) toggleVideoFull(); }   // clic sur « Lancer » : le plein écran du navigateur est autorisé
function doStop(){ if(st.play) sendSpeed(spdMin); if(!archiveRun()) st.justDone=null; st.play=null; st.vfull=false; st.view='history'; render(); }
// position sur le parcours : distance courue + décalage de la séance (départ au km X, passages sautés) ;
// la distance courue (st.dist) reste la vraie, c'est elle qui part dans l'historique et sur Strava
function rpos(){ return st.dist+(st.play&&st.play.offset||0); }
const SKIP_M=500;
function routeSkip(m){ const p=st.play; if(!p||p.type!=='gpx') return;
  const max=Math.max(0,p.session.totalDist-20-st.dist);
  p.offset=clamp((p.offset||0)+m, p.started?(p.offset||0):0, max); render(); }
function segAtDist(sess,d){ const segs=sess.segs; for(let i=0;i<segs.length;i++) if(d<segs[i].d1) return segs[i]; return segs[segs.length-1]; }
function segIdxAtDist(sess,d){ const segs=sess.segs; for(let i=0;i<segs.length;i++) if(d<segs[i].d1) return i; return segs.length-1; }

// ---------- historique / export ----------
function unloadPlay(){ st.play=null; st.vfull=false; st.view='drive'; render(); }
// renvoie true si la course a été enregistrée ; sinon le bandeau « Séance terminée » est retiré (il montrait la course précédente)
function archiveRun(){
  if(sim && !simRecord){ const had=rec.length>1; rec=[]; if(had){ st.justDone=null; st.msg='Séance simulée : non enregistrée (active « Enregistrer (tester Strava) » pour la garder).'; st.msgColor='#E8C547'; } return false; }
  if(rec.length<2) return false;
  const s=[]; for(let i=0;i<rec.length;i+=5) s.push(rec[i]); const last=rec[rec.length-1], first=rec[0];
  if(s[s.length-1]!==last) s.push(last);
  const nm=st.play?st.play.session.name:'';
  const entry={id:'r'+Date.now(), date:first.t, name:sim?'[Test] '+(nm||'Simulation'):nm, dist:Math.round(last.dist),
    dplus:Math.round(last.alt), dur:Math.round((new Date(last.t)-new Date(first.t))/1000), route:activeRoute||null, samples:s};
  st.justDone=entry.id; cloudPut('history',entry); const arr=[entry].concat(st.history).slice(0,50); persist('tm_history',arr); st.history=arr; rec=[]; return true; }
function finishRun(){ if(!archiveRun()) st.justDone=null; st.view='history'; st.dist=0; st.dplus=0; st.elapsed=0; st.grades=[]; render(); }
function delHist(id){ st.history=st.history.filter(x=>x.id!==id); persist('tm_history',st.history); cloudDel('history',id); render(); }
function toggleSelMode(k){ selMode[k]=!selMode[k]; selSet[k].clear(); render(); }
function selToggle(k,id){ const s=selSet[k]; if(s.has(id)) s.delete(id); else s.add(id); render(); }
function bulkDelete(k){ const s=selSet[k]; if(!s.size) return;
  s.forEach(id=>cloudDel(k==='hist'?'history':'sessions',id));
  if(k==='hist'){ st.history=st.history.filter(x=>!s.has(x.id)); persist('tm_history',st.history); }
  else { st.sessions=st.sessions.filter(x=>!s.has(x.id)); persist('tm_sessions',st.sessions); }
  s.clear(); selMode[k]=false; render(); }
function openRename(kind,id){ renaming={kind,id}; render(); setTimeout(()=>{ const el=document.getElementById('renameInput'); if(el){ el.focus(); el.select(); } },30); }
function closeRename(){ renaming=null; render(); }
function doRename(){ if(!renaming) return; const v=(document.getElementById('renameInput').value||'').trim();
  if(renaming.kind==='sess'){ const x=st.sessions.find(y=>y.id===renaming.id); if(x&&v){ x.name=v; cloudPut('sessions',x); persist('tm_sessions',st.sessions); } }
  else { const x=st.history.find(y=>y.id===renaming.id); if(x){ x.name=v; cloudPut('history',x); persist('tm_history',st.history); } }
  renaming=null; render(); }
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function fname(ext){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return 'threadmill-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.'+ext; }
function histFit(id){ const h=st.history.find(x=>x.id===id); if(!h) return;
  if(h.route){ const b=buildFit(h.samples,h.route); if(b) dl(new Blob([b],{type:'application/octet-stream'}), fname('fit')); }
  else { st.shapePick={id,action:'fit'}; render(); } }
function doFit(id,shape){ const h=st.history.find(x=>x.id===id); if(!h) return; const b=buildFit(h.samples,h.route,shape); if(b) dl(new Blob([b],{type:'application/octet-stream'}), fname('fit')); }
const STRAVA_FN='/.netlify/functions/strava';
function loadStrava(){ try{ return JSON.parse(localStorage.getItem('tm_strava')||'null'); }catch(e){ return null; } }
function saveStrava(t){ try{ localStorage.setItem('tm_strava', JSON.stringify(t)); }catch(e){} st.strava=t; settingsChanged('strava'); }
// Domaine de rappel de l'app Strava (partagée avec Trail Planner Pro) : trailplannerpro.com, dont le relais renvoie ici (state « tm »)
function stravaConnect(){ const redirect='https://trailplannerpro.com/strava-relay/';
  location.href='https://www.strava.com/oauth/authorize?client_id=277538&response_type=code&redirect_uri='+encodeURIComponent(redirect)+'&approval_prompt=auto&scope=activity:write&state=tm'; }
function stravaLogout(){ localStorage.removeItem('tm_strava'); st.strava=null; settingsChanged('strava'); render(); }
async function stravaExchange(code){
  try{ const r=await fetch(STRAVA_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'exchange',code})});
    const j=await r.json();

function haversine(a,b){ const R=6371000, r=x=>x*Math.PI/180, dLat=r(b.lat-a.lat), dLon=r(b.lon-a.lon);

async function onGpx(e){ const file=e.target.files&&e.target.files[0]; if(!file) return;
  try{
    const doc=new DOMParser().parseFromString(await file.text(),'application/xml');
    if(doc.querySelector('parsererror')) throw new Error('fichier illisible');
    let raw=[...doc.getElementsByTagName('trkpt')]; if(raw.length<2) raw=[...doc.getElementsByTagName('rtept')]; if(raw.length<2) raw=[...doc.getElementsByTagName('wpt')];
    const pts=raw.map(p=>({lat:parseFloat(p.getAttribute('lat')), lon:parseFloat(p.getAttribute('lon')),
      ele:parseFloat(p.getElementsByTagName('ele')[0]&&p.getElementsByTagName('ele')[0].textContent),
      time:p.getElementsByTagName('time')[0]&&p.getElementsByTagName('time')[0].textContent}));
    if(pts.length<2) throw new Error('aucun point exploitable');
    if(!pts.every(p=>!isNaN(p.ele))) throw new Error('altitude manquante sur certains points');
    const hasTime=pts.every(p=>p.time);
    let cum=0; pts[0].d=0; for(let i=1;i<pts.length;i++){ cum+=haversine(pts[i-1],pts[i]); pts[i].d=cum; }
    const segs=[]; let start=0;
    while(start<pts.length-1){ let end=start; while(end<pts.length-1 && pts[end].d-pts[start].d<GPX_SEG) end++;
      const sd=pts[end].d-pts[start].d; if(sd<=0){ start=end+1; continue; }
      let grade=clamp((pts[end].ele-pts[start].ele)/sd*100,0,15), spd=null;
      if(hasTime){ const dt=(new Date(pts[end].time)-new Date(pts[start].time))/1000; if(dt>0) spd=clamp(sd/dt*3.6,1,18); }
      segs.push({d0:pts[start].d,d1:pts[end].d,grade:+grade.toFixed(1),spd:spd!=null?+spd.toFixed(1):null}); start=end; }
    let dplus=0; for(let i=1;i<pts.length;i++){ const dz=pts[i].ele-pts[i-1].ele; if(dz>0) dplus+=dz; }
    let nm=file.name.replace(/\.gpx$/i,'').replace(/^\d+[-_]*/,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
    if(!nm) nm=file.name.replace(/\.gpx$/i,'');
    const sess={id:'g'+Date.now(), type:'gpx', name:nm, hasTime, totalDist:Math.round(cum), totalDplus:Math.round(dplus), segs,
      track:pts.map(p=>({d:+p.d.toFixed(1),lat:p.lat,lon:p.lon,ele:+p.ele.toFixed(1)}))};
    cloudPut('sessions',sess); st.sessions=st.sessions.concat([sess]); persist('tm_sessions',st.sessions);
    st.msg='Importé : '+(cum/1000).toFixed(2)+' km · '+Math.round(dplus)+' m D+'+(hasTime?' · allure incluse':' · profil seul'); st.msgColor=ACC; render();
  }catch(err){ st.msg='GPX : '+err.message; st.msgColor='#FF7A6B'; render(); }
  e.target.value=''; }

    const files=pk.files.map((f,i)=>({name:f.name, size:f.size, dur:Math.round(reads[i].dur*100)/100}));
    const withGps=reads.filter(r=>r.pts.length>10).length;
    let v=null;

    if(v){ saveVideo(sess, pk, files, v, 'gps'); return; }
    const why = withGps ? 'Le GPS de la vidéo ne suit pas ce tracé.'

async function findInDir(dir, want, depth){ const out=new Array(want.length).fill(null);
  const walk=async(d,lvl)=>{ for await (const e of d.values()){
      if(out.every(Boolean)) return;
      if(e.kind==='file'){ const k=want.findIndex((w,i)=>!out[i] && w.name.toLowerCase()===e.name.toLowerCase());
        if(k>=0){ const f=await e.getFile(); if(f.size===want[k].size) out[k]=f; } }
      else if(lvl<depth) await walk(e,lvl+1); } };
  await walk(dir,0); return out.every(Boolean)?out:null; }
async function opfsFiles(sess){ if(!OPFS_API) return null;

async function restoreVideo(sess, interactive){ if(!sess.video || vidFiles[sess.id]) return true;
  const done=f=>{ vidFiles[sess.id]=f; delete vidNeed[sess.id]; render(); return true; };
  const ok=async h=>{ if(!h.queryPermission) return true; let p=await h.queryPermission({mode:'read'}); if(p!=='granted' && interactive) p=await h.requestPermission({mode:'read'}); return p==='granted'; };
  const kept=await opfsFiles(sess); if(kept){ vidKept[sess.id]=true; return done(kept); }
  if(vidDir){ try{ if(await ok(vidDir)){ const f=await findInDir(vidDir, sess.video.files, 3); if(f){ idbSet('h_'+sess.id,null); return done(f); } vidNeed[sess.id]='missing'; }
      else vidNeed[sess.id]='perm'; }catch(e){ vidNeed[sess.id]='perm'; } }
  const hs=await idbGet('h_'+sess.id);

      if(all) return done(await Promise.all(hs.map(h=>h.getFile())));

  render(); return false; }

const routeCache=new WeakMap();

function videoSync(){ const v=document.getElementById('tmv'), play=st.play, sess=play&&play.session;
  const files=sess&&sess.video&&vidFiles[sess.id];
  if(!files || st.view!=='play'){ if(!v.paused) v.pause(); if(!play&&vidCur.url){ URL.revokeObjectURL(vidCur.url); vidCur={sid:null,fi:-1,url:null}; v.removeAttribute('src'); v.load(); } return; }
  const moving=st.speed>0 && play.started && !play.paused;
  const dEst=rpos()+(moving&&lastTickAt? st.speed/3.6*Math.min(1.2,(performance.now()-lastTickAt)/1000) : 0);
  const at=TMGoPro.videoAt(sess.video, dEst);
  const out = at? '' : (dEst<sess.video.d0? 'La vidéo commence à '+(sess.video.d0/1000).toFixed(2)+' km' : 'Fin de la vidéo');
  if(out!==(vidCur.out||'')){ vidCur.out=out; placeVideo(); }
  if(!at){ if(!v.paused) v.pause(); return; }
  if(vidCur.sid!==sess.id || vidCur.fi!==at.fi){ if(vidCur.url) URL.revokeObjectURL(vidCur.url);
    vidCur.url=URL.createObjectURL(files[at.fi]); vidCur.sid=sess.id; vidCur.fi=at.fi; v.src=vidCur.url; v.currentTime=at.t; }
  if(!moving){ if(!v.paused) v.pause(); if(v.readyState>=1 && Math.abs(v.currentTime-at.t)>0.5) v.currentTime=at.t; return; }
  const drift=at.t-v.currentTime;
  if(Math.abs(drift)>3 && v.readyState>=1){ v.currentTime=at.t; }
  const base=at.vs>0.3 ? (st.speed/3.6)/at.vs : 1;
  v.playbackRate=clamp(base*(1+clamp(drift*0.25,-0.5,0.5)),0.2,6);
  if(v.paused) v.play().catch(()=>{}); }

// ---------- graphes ----------
function gpxBars(sess, coveredM){ const N=26, per=sess.totalDist/N, cur=Math.floor(clamp(coveredM,0,sess.totalDist-1)/per);
  let ele=0; const raw=[]; for(let i=0;i<N;i++){ const d=i*per, s=segAtDist(sess,d); ele+=s.grade/100*per; raw.push(ele); }
  const max=Math.max(1,...raw); return raw.map((v,i)=>({h:Math.max(6,Math.round(v/max*100))+'%', color:i<cur?PAST:(i===cur?ACC:DIM)})); }
function resample(arr,N){ if(!arr.length) return []; N=Math.min(N,Math.max(2,arr.length)); const out=[];
  for(let i=0;i<N;i++){ const a=Math.floor(i*arr.length/N), b=Math.max(a+1,Math.floor((i+1)*arr.length/N)); let s=0,c=0; for(let j=a;j<b&&j<arr.length;j++){s+=arr[j];c++;} out.push(c?s/c:0); } return out; }
function gradeBars(grades){ const rs=resample(grades,34), max=Math.max(4,...rs,1);
  return rs.map((g,i)=>({h:Math.max(6,Math.round(g/max*100))+'%', color:i===rs.length-1?ACC:PAST})); }
function intervalBars(segs, idx){ return segs.map((s,i)=>({flex:Math.max(1,Math.round(s.dur/10)), h:Math.max(14,Math.round(s.spd/18*100))+'%', color:i<idx?PAST:(i===idx?ACC:DIM)})); }
function barsHtml(bars){ return bars.map(b=>'<div style="flex:'+(b.flex||1)+';min-width:2px;border-radius:1px 1px 0 0;background:'+b.color+';height:'+b.h+'"></div>').join(''); }

// ---------- boucle 1 Hz ----------
function tick(){
  if(!st.connected) return;
  const speed=st.speed;
  // course libre (pas de séance) : dès que la courroie démarre, pousse la consigne d'allure/pente
  if(!st.play){
    if(speed>0){
      if(!freeStarted){ freeStarted=true; freeReaching=true; }
      if(freeReaching){ sendSpeed(st.spdT); sendIncline(st.incT); if(Math.abs(speed-st.spdT)<0.3) freeReaching=false; }
      else { st.spdT=+speed.toFixed(1); }   // cible atteinte : l'app suit la vitesse réelle (bouton physique)
    } else { freeStarted=false; freeReaching=false; }
  }
  lastTickAt=performance.now();
  if(speed>0){ const m=speed/3.6; st.dist+=m; st.dplus+=(curGrade>0?m*curGrade/100:0); st.elapsed+=1;
    const smp={t:clockIso(), dist:st.dist, spd:speed, alt:st.dplus, hr:st.hr||0}; if(st.play&&st.play.offset) smp.rd=Math.round(rpos()*10)/10; rec.push(smp);
    st.grades.push(curGrade);
    st.speeds.push(st.speed); }
  playAdvance();
  if((st.view==='drive'||st.view==='play') && !st.hrz && !st.settings) render();
}
function playAdvance(){ const play=st.play; if(!play||play.paused) return;
  let justStarted=false;
  if(!play.started && st.speed>0){ play.started=true; justStarted=true; }
  if(play.type==='interval'){ const segs=play.session.segments, seg=segs[play.idx];
    if(play.started && st.speed>0) play.segElapsed=(play.segElapsed||0)+1;
    let advanced=false;
    if(play.segElapsed>=seg.dur){ if(play.idx+1>=segs.length){ doStop(); return; } play.idx++; play.segElapsed=0; advanced=true; }
    const cur=segs[play.idx]; applyTargets(cur.spd,cur.inc, justStarted||advanced);
  }else{ const sess=play.session, seg=segAtDist(sess,rpos());
    if(play.started && rpos()>=sess.totalDist){ doStop(); return; }
    applyTargets(play.mode==='gpx' && seg.spd!=null ? seg.spd : null, seg.grade, justStarted); }
}
function applyTargets(spd,inc,force){
  if(spd!=null && (force || Math.abs(spd-st.spdT)>0.05 || Math.abs(st.speed-spd)>0.3)){ st.spdT=spd; sendSpeed(spd); }
  if(inc!=null && (force || Math.abs(inc-st.incT)>0.15)){ st.incT=+inc.toFixed(1); sendIncline(inc); } }

function render(){
  const s=st, play=s.play, running=s.speed>0;
  const dotColor=(s.connected||s.hrOn)?ACC:'#4c5142';
  const linkLabel=sim?'Simulation':s.connected?(s.hrOn?'Tapis · FC':'Tapis'):'Hors ligne';

    '<button onclick="openSheet()" style="display:flex;align-items:center;gap:8px;background:#191b18;border:1px solid #26291f;border-radius:99px;padding:6px 12px">'+
    '<span style="width:7px;height:7px;border-radius:99px;background:'+dotColor+'"></span>'+
    '<span style="font:600 12.5px Barlow;color:#C3C8B8">'+linkLabel+'</span></button></div></div>';

  if(s.view==='drive'||s.view==='play') html+=simBar();
  if(s.view==='drive') html+=viewDrive();
  else if(s.view==='sessions') html+=viewSessions();
  else if(s.view==='build') html+=viewBuild();
  else if(s.view==='history') html+=viewHistory();
  else if(s.view==='play') html+=viewPlay();

  if(s.view!=='play'){
    const t=v=>v?ACC:'#8A8F80';
    html+='<div style="position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #23261e;background:#0c0d0c;padding:9px 10px 18px">'+
      '<button onclick="go(\'drive\')" style="background:transparent;padding:6px 0;font:600 12.5px Barlow;letter-spacing:.04em;color:'+t(s.view==='drive')+'">Pilotage</button>'+
      '<button onclick="go(\'sessions\')" style="background:transparent;padding:6px 0;font:600 12.5px Barlow;letter-spacing:.04em;color:'+t(s.view==='sessions'||s.view==='build')+'">Séances</button>'+
      '<button onclick="go(\'history\')" style="background:transparent;padding:6px 0;font:600 12.5px Barlow;letter-spacing:.04em;color:'+t(s.view==='history')+'">Historique</button></div>';
  }
  if(s.sheet) html+=viewSheet();
  if(s.settings) html+=viewSettings();
  if(renaming) html+=viewRename();
  if(st.shapePick) html+=viewShape();
  if(st.vidSheet) html+=viewVideoSheet();
  if(st.hrz) html+=viewHrz();
  const sc=document.getElementById('settingsScroll'), top=sc?sc.scrollTop:0;
  document.getElementById('ui').innerHTML=html;
  const sc2=document.getElementById('settingsScroll'); if(sc2) sc2.scrollTop=top;

}

function statBar(sz){ const s=st; return '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#26291f;margin:'+(sz>30?'14':'12')+'px 18px 0;border-radius:14px;overflow:hidden">'+
  stat('KM',(s.dist/1000).toFixed(2),sz)+stat('D+',String(Math.round(s.dplus)),sz)+stat('TEMPS',fmt(s.elapsed),sz)+statFc(sz)+'</div>'; }
function statFc(sz){ const z=hrZone(st.hr);
  if(!z) return stat('FC',st.hr>0?String(st.hr):'—',sz,'#FF7A6B');

    '<div style="font:600 10.5px Barlow;letter-spacing:.1em;color:'+z.col+'">FC · Z'+z.n+'</div>'+
    '<div style="font:600 '+sz+'px \'Barlow Condensed\';line-height:1;color:'+z.col+';font-variant-numeric:tabular-nums">'+st.hr+'</div></div>'; }
function stat(lbl,val,sz,col){ return '<div style="background:#191b18;padding:'+(sz>30?'11':'10')+'px 4px;text-align:center">'+
  '<div style="font:600 10.5px Barlow;letter-spacing:.1em;color:#8A8F80">'+lbl+'</div>'+
  '<div style="font:600 '+sz+'px \'Barlow Condensed\';line-height:1'+(col?';color:'+col:'')+';font-variant-numeric:tabular-nums">'+val+'</div></div>'; }

function graphCard(){ const s=st, play=s.play; let bars,title,right,prog='0%';
  if(play && play.type==='gpx'){ const rp=rpos(); bars=gpxBars(play.session,rp); title='PROFIL · '+play.session.name.toUpperCase();
    right=((play.session.totalDist-Math.min(rp,play.session.totalDist))/1000).toFixed(1)+' km'; prog=Math.min(100,rp/play.session.totalDist*100)+'%'; }
  else if(s.grades.length>=2){ bars=gradeBars(s.grades);
    const pMax=Math.max(...s.grades.slice(-26),1).toFixed(0), vMax=Math.max(...s.speeds.slice(-26),1).toFixed(0);
    title='COURSE · PENTE ≤'+pMax+'% · VIT ≤'+vMax; right=Math.round(s.incReal)+' % · '+s.speed.toFixed(1)+' km/h'; prog=Math.min(100,s.incReal/incMax*100)+'%'; }
  else {
    // à l'arrêt, rien lancé : pas de graphe, juste un accès aux séances
    return '<button onclick="go(\'sessions\')" style="margin:6px 18px 0;background:#191b18;border:1px solid #26291f;border-radius:20px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:calc(100% - 36px)">'+
      '<span style="font:600 13.5px Barlow;color:#C3C8B8;text-align:left">Choisir une séance ou un GPX<br><span style="font:500 12px Barlow;color:#6d7264">le profil s\'affiche pendant la course</span></span>'+
      '<span style="font:600 22px Barlow;color:#CBF24E">→</span></button>';
  }
  const overlay = (!play && s.speeds.length>=2) ? speedLine(s.speeds) : '';
  return '<div style="margin:6px 18px 0;background:#191b18;border:1px solid #26291f;border-radius:20px;padding:13px 14px 11px">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px"><span style="font:600 11.5px Barlow;letter-spacing:.12em;color:#8A8F80">'+title+'</span><span style="font:600 12.5px Barlow;color:#C3C8B8">'+right+'</span></div>'+
    '<div style="position:relative;height:74px"><div style="display:flex;align-items:flex-end;gap:2px;height:74px">'+barsHtml(bars)+'</div>'+overlay+'</div>'+
    '<div style="height:3px;background:#23261e;border-radius:2px;margin-top:9px;display:flex"><div style="background:#CBF24E;border-radius:2px;width:'+prog+'"></div></div></div>'; }
function speedLine(speeds){ const rs=resample(speeds,34); if(rs.length<2) return ''; const max=Math.max(...rs, spdMax*0.6, 1);
  const pts=rs.map((v,i)=>{ const x=(i/(rs.length-1))*100, y=74-(v/max)*70-2; return x.toFixed(1)+','+y.toFixed(1); });
  return '<svg viewBox="0 0 100 74" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:74px;pointer-events:none"><polyline points="'+pts.join(' ')+'" fill="none" stroke="#C3C8B8" stroke-width="1.4" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="0.9"/></svg>'; }

function cmdCard(lbl,range,val,down,up){ return '<div style="background:#191b18;border:1px solid #26291f;border-radius:20px;padding:14px 12px">'+

    '<div style="font:500 12px Barlow;color:#6d7264;line-height:1.5">Le démarrage de la courroie reste sur le bouton physique du tapis. L\'app pilote l\'allure et la pente, et enregistre la course.</div></div></div>'; }

document.addEventListener('visibilitychange', async ()=>{ if(document.visibilityState==='visible' && st.connected){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} } });
document.getElementById('gpxFile').addEventListener('change', onGpx);
st.sessions=loadLS('tm_sessions'); st.history=loadLS('tm_history'); st.strava=loadStrava();
try{ const u=localStorage.getItem('tm_unit'); if(u) st.mainUnit=u; }catch(e){}
(function(){ const params=new URLSearchParams(location.search); const code=params.get('code');
  if(code){ history.replaceState({},'',location.pathname); st.view='history'; stravaExchange(code); }
})();
setInterval(tick,1000);
setInterval(()=>{ if(sim&&simFast){ for(let i=0;i<9;i++) tick(); } },1000);   // simulation accélérée : 10 pas par seconde
setInterval(videoSync,250);
window.addEventListener('resize', placeVideo);
render();
loadKnown();
</script>
