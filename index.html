<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threadmill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#070807;font-family:Barlow,system-ui,sans-serif;color:#F2F4EE;-webkit-tap-highlight-color:transparent}
  *{box-sizing:border-box}
  button{font-family:Barlow;cursor:pointer;border:none}
  input{font-family:Barlow}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:#101110;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .stepbtn:active{filter:brightness(1.15)}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="gpxFile" accept=".gpx" style="display:none">
<script>
const FTMS=0x1826, DATA=0x2acd, CONTROL=0x2ad9, SPD_RANGE=0x2ad4, INC_RANGE=0x2ad5;
const HR_SVC=0x180d, HR_MEAS=0x2a37, SENT=0x7fff, GPX_SEG=50;
const DIM='#23261e', PAST='#4c5142', ACC='#CBF24E';
const STEP=0.1;

let st={ view:'drive', connected:false, hrOn:false, speed:0, dist:0, dplus:0, elapsed:0, hr:0,
  spdT:9.5, incT:4, grades:[], sessions:[], history:[], draft:null, buildErr:'', msg:'', msgColor:'#8A8F80',
  play:null, sheet:false };
let spdMin=1, spdMax=18, incMin=0, incMax=15;
let device=null, controlChar=null, hrDevice=null, wakeLock=null;
let rec=[], activeRoute=null, gattQueue=Promise.resolve(), lastTs=0, curGrade=0;

// ---------- utils ----------
function loadLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }
function persist(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function fmt(t){ t=Math.max(0,Math.round(t)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return h? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') : m+':'+String(s).padStart(2,'0'); }
function totals(segs){ let dur=0,dist=0,dp=0; segs.forEach(s=>{ dur+=s.dur; const m=(s.spd/3.6)*s.dur; dist+=m; if(s.inc>0) dp+=m*s.inc/100; }); return {dur,dist:Math.round(dist),dp:Math.round(dp)}; }
function num(v){ const n=parseFloat(String(v||'').replace(',','.')); return isNaN(n)?0:n; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function clamp(v,a,b){ return Math.min(b,Math.max(a,v)); }

// ---------- BLE ----------
async function connect(){
  if(!navigator.bluetooth){ st.msg='Web Bluetooth requis (Chrome, HTTPS/localhost).'; st.msgColor='#FF7A6B'; render(); return; }
  try{
    device = await navigator.bluetooth.requestDevice({filters:[{services:[FTMS]}], optionalServices:[FTMS,0xfff0]});
    device.addEventListener('gattserverdisconnected', ()=>{ archiveRun(); st.connected=false; render(); });
    const server=await device.gatt.connect();
    const svc=await server.getPrimaryService(FTMS);
    const dataCh=await svc.getCharacteristic(DATA);
    await dataCh.startNotifications();
    dataCh.addEventListener('characteristicvaluechanged', e=>parseData(e.target.value));
    controlChar=await svc.getCharacteristic(CONTROL);
    await controlChar.startNotifications();
    await readRanges(svc);
    await sendControl([0x00]); sendControl([0x07]);
    st.connected=true; st.dist=0; st.dplus=0; st.elapsed=0; rec=[]; st.sheet=false;
    try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
    render();
  }catch(err){ st.msg='Connexion : '+err.message; st.msgColor='#FF7A6B'; render(); }
}
function disconnect(){ if(device&&device.gatt.connected) device.gatt.disconnect(); st.connected=false; render(); }
async function readRanges(svc){
  try{ const d=await (await svc.getCharacteristic(SPD_RANGE)).readValue(); spdMin=d.getUint16(0,true)*0.01; spdMax=d.getUint16(2,true)*0.01; }catch(e){}
  try{ const d=await (await svc.getCharacteristic(INC_RANGE)).readValue(); incMin=d.getInt16(0,true)*0.1; incMax=d.getInt16(2,true)*0.1; }catch(e){}
}
async function pairHr(){
  if(!navigator.bluetooth) return;
  try{
    hrDevice=await navigator.bluetooth.requestDevice({filters:[{services:[HR_SVC]}]});
    hrDevice.addEventListener('gattserverdisconnected', ()=>{ st.hrOn=false; st.hr=0; render(); });
    const s=await hrDevice.gatt.connect();
    const ch=await (await s.getPrimaryService(HR_SVC)).getCharacteristic(HR_MEAS);
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged', e=>{ const dv=e.target.value,f=dv.getUint8(0); st.hr=(f&1)?dv.getUint16(1,true):dv.getUint8(1); render(); });
    st.hrOn=true; render();
  }catch(err){ st.msg='Cardio : '+err.message; st.msgColor='#FF7A6B'; render(); }
}
function sendControl(bytes){ if(!controlChar) return Promise.resolve();
  gattQueue=gattQueue.then(async()=>{ try{ await controlChar.writeValueWithResponse(new Uint8Array(bytes)); }catch(e){} }); return gattQueue; }
function sendSpeed(v){ v=clamp(v,spdMin,spdMax); const r=Math.round(v*100); return sendControl([0x02,r&0xff,(r>>8)&0xff]); }
function sendIncline(v){ v=clamp(v,incMin,incMax); const b=new ArrayBuffer(3),dv=new DataView(b); dv.setUint8(0,0x03); dv.setInt16(1,Math.round(v*10),true); return sendControl([...new Uint8Array(b)]); }
function parseData(dv){
  let o=0; const flags=dv.getUint16(o,true); o+=2; const has=b=>(flags&(1<<b))!==0; const out={};
  if(!has(0)){ out.speed=dv.getUint16(o,true)*0.01; o+=2; }
  if(has(1)) o+=2; if(has(2)) o+=3;
  if(has(3)){ const i=dv.getInt16(o,true); o+=4; out.incline=(i===SENT)?null:i*0.1; }
  if(out.speed!=null) st.speed=out.speed;
  if(out.incline!=null) curGrade=out.incline;
}

// ---------- réglages ----------
function adjSpd(d){ const v=clamp(+(st.spdT+d).toFixed(1),spdMin,spdMax); st.spdT=v; sendSpeed(v); render(); }
function adjInc(d){ const v=clamp(+(st.incT+d).toFixed(1),incMin,incMax); st.incT=v; sendIncline(v); render(); }

// ---------- séances ----------
function newSession(){ st.view='build'; st.buildErr=''; st.draft={id:'s'+Date.now(),type:'interval',name:'',segments:[{name:'Échauffement',dur:600,spd:8,inc:1},{name:'Bloc',dur:120,spd:10,inc:6}]}; render(); }
function editSession(id){ const s=st.sessions.find(x=>x.id===id); if(!s) return; st.view='build'; st.buildErr=''; st.draft=JSON.parse(JSON.stringify(s)); render(); }
function saveSession(){ const d=st.draft;
  if(!(d.name||'').trim()){ st.buildErr='Donne un nom à la séance.'; render(); return; }
  if(!d.segments.length){ st.buildErr='Ajoute au moins un bloc.'; render(); return; }
  const arr=st.sessions.slice(); const i=arr.findIndex(x=>x.id===d.id); if(i>=0) arr[i]=d; else arr.push(d);
  persist('tm_sessions',arr); st.sessions=arr; st.view='sessions'; st.draft=null; st.msg='Séance enregistrée.'; st.msgColor=ACC; render(); }
function delSession(id){ st.sessions=st.sessions.filter(x=>x.id!==id); persist('tm_sessions',st.sessions); render(); }
function mutDraft(fn){ fn(st.draft); render(); }
function segEdit(i,field,val){ const d=st.draft;
  if(field==='name') d.segments[i].name=val;
  else if(field==='min'){ const v=parseInt(val||'0',10)||0; d.segments[i].dur=v*60+d.segments[i].dur%60; }
  else if(field==='sec'){ const v=parseInt(val||'0',10)||0; d.segments[i].dur=Math.floor(d.segments[i].dur/60)*60+v; }
  else if(field==='spd') d.segments[i].spd=num(val);
  else if(field==='inc') d.segments[i].inc=num(val);
  render(); }
function segDup(i){ mutDraft(d=>d.segments.splice(i+1,0,JSON.parse(JSON.stringify(d.segments[i])))); }
function segDel(i){ mutDraft(d=>d.segments.splice(i,1)); }
function segAdd(){ mutDraft(d=>{ const l=d.segments[d.segments.length-1]||{spd:9,inc:2}; d.segments.push({name:'',dur:120,spd:l.spd,inc:l.inc}); }); }
function draftNameSet(v){ st.draft.name=v; }

function launch(id){ const s=st.sessions.find(x=>x.id===id); if(!s) return;
  rec=[]; activeRoute = s.track&&s.track.length>1 ? s.track : null;
  const play = s.type==='gpx' ? {type:'gpx',session:s,mode:s.hasTime?'gpx':'free',started:false,paused:false}
    : {type:'interval',session:s,idx:0,segElapsed:0,started:false,paused:false};
  const first = s.type==='gpx' ? s.segs[0] : s.segments[0];
  st.play=play; st.view='play'; st.dist=0; st.dplus=0; st.elapsed=0; st.grades=[];
  st.spdT = s.type==='gpx' ? (first.spd||st.spdT) : first.spd;
  st.incT = s.type==='gpx' ? first.grade : first.inc;
  sendControl([0x07]); render(); }
function doStop(){ if(st.play) sendSpeed(spdMin); archiveRun(); st.play=null; st.view='history'; render(); }
function segAtDist(sess,d){ const segs=sess.segs; for(let i=0;i<segs.length;i++) if(d<segs[i].d1) return segs[i]; return segs[segs.length-1]; }
function segIdxAtDist(sess,d){ const segs=sess.segs; for(let i=0;i<segs.length;i++) if(d<segs[i].d1) return i; return segs.length-1; }

// ---------- historique / export ----------
function archiveRun(){
  if(rec.length<2) return;
  const s=[]; for(let i=0;i<rec.length;i+=3) s.push(rec[i]); const last=rec[rec.length-1], first=rec[0];
  if(s[s.length-1]!==last) s.push(last);
  const entry={id:'r'+Date.now(), date:first.t, name:st.play?st.play.session.name:'', dist:Math.round(last.dist),
    dplus:Math.round(last.alt), dur:Math.round((new Date(last.t)-new Date(first.t))/1000), route:activeRoute||null, samples:s};
  const arr=[entry].concat(st.history).slice(0,12); persist('tm_history',arr); st.history=arr; rec=[]; }
function finishRun(){ archiveRun(); st.view='history'; st.dist=0; st.dplus=0; st.elapsed=0; st.grades=[]; render(); }
function delHist(id){ st.history=st.history.filter(x=>x.id!==id); persist('tm_history',st.history); render(); }
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function fname(ext){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return 'threadmill-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.'+ext; }
function histFit(id){ const h=st.history.find(x=>x.id===id); if(!h) return; const b=buildFit(h.samples,h.route); if(b) dl(new Blob([b],{type:'application/octet-stream'}), fname('fit')); }
function histTcx(id){ const h=st.history.find(x=>x.id===id); if(!h) return; const x=buildTcx(h.samples); if(x) dl(new Blob([x],{type:'application/vnd.garmin.tcx+xml'}), fname('tcx')); }
function buildTcx(sm){ if(sm.length<2) return null;
  const start=sm[0].t, total=(new Date(sm[sm.length-1].t)-new Date(start))/1000, td=sm[sm.length-1].dist; let pts='';
  for(const s of sm) pts+='<Trackpoint><Time>'+s.t+'</Time><DistanceMeters>'+s.dist.toFixed(1)+'</DistanceMeters><AltitudeMeters>'+s.alt.toFixed(1)+'</AltitudeMeters>'+(s.hr>0?'<HeartRateBpm><Value>'+Math.round(s.hr)+'</Value></HeartRateBpm>':'')+'<Extensions><ns3:TPX><ns3:Speed>'+(s.spd/3.6).toFixed(2)+'</ns3:Speed></ns3:TPX></Extensions></Trackpoint>';
  return '<?xml version="1.0" encoding="UTF-8"?>\n<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:ns3="http://www.garmin.com/xmlschemas/ActivityExtension/v2"><Activities><Activity Sport="Running"><Id>'+start+'</Id><Lap StartTime="'+start+'"><TotalTimeSeconds>'+total.toFixed(0)+'</TotalTimeSeconds><DistanceMeters>'+td.toFixed(1)+'</DistanceMeters><Calories>0</Calories><Intensity>Active</Intensity><TriggerMethod>Manual</TriggerMethod><Track>'+pts+'</Track></Lap></Activity></Activities></TrainingCenterDatabase>'; }
function fitCRC(b){ const t=[0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400]; let crc=0;
  for(let i=0;i<b.length;i++){ const x=b[i]; let tmp=t[crc&0xF]; crc=(crc>>4)&0x0FFF; crc=crc^tmp^t[x&0xF]; tmp=t[crc&0xF]; crc=(crc>>4)&0x0FFF; crc=crc^tmp^t[(x>>4)&0xF]; } return crc&0xFFFF; }
function posAt(route,dd){ if(dd<=route[0].d) return route[0]; const last=route[route.length-1]; if(dd>=last.d) return last;
  let lo=0,hi=route.length-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(route[m].d<=dd) lo=m; else hi=m; }
  const a=route[lo],b=route[hi],sp=b.d-a.d,f=sp>0?(dd-a.d)/sp:0; return {lat:a.lat+(b.lat-a.lat)*f, lon:a.lon+(b.lon-a.lon)*f, ele:a.ele+(b.ele-a.ele)*f}; }
function buildFit(sm,route){ if(sm.length<2) return null;
  const D=[], u8=v=>D.push(v&0xFF), u16=v=>{D.push(v&0xFF);D.push((v>>8)&0xFF);}, u32=v=>{v=v>>>0;D.push(v&0xFF);D.push((v>>>8)&0xFF);D.push((v>>>16)&0xFF);D.push((v>>>24)&0xFF);};
  const EPOCH=631065600, toFit=iso=>Math.round(new Date(iso).getTime()/1000-EPOCH), SC=2147483648/180, sc=d=>Math.round(d*SC);
  const t0=toFit(sm[0].t), t1=toFit(sm[sm.length-1].t), totalSec=Math.max(1,t1-t0);
  const td=sm[sm.length-1].dist, asc=Math.round(sm[sm.length-1].alt), real=!!(route&&route.length>1), BLAT=45.9237, BLON=6.8694;
  const def=(l,g,f)=>{ u8(0x40|l); u8(0); u8(0); u16(g); u8(f.length); f.forEach(x=>{u8(x[0]);u8(x[1]);u8(x[2]);}); };
  def(0,0,[[0,1,0x00],[1,2,0x84],[2,2,0x84],[4,4,0x86],[3,4,0x8C]]);
  u8(0); u8(4); u16(255); u16(0); u32(toFit(new Date().toISOString())); u32(0);
  def(1,20,[[253,4,0x86],[5,4,0x86],[2,2,0x84],[6,2,0x84],[3,1,0x02],[0,4,0x85],[1,4,0x85]]);
  for(const s of sm){ let lat,lon,alt;
    if(real){ const p=posAt(route,s.dist); lat=p.lat; lon=p.lon; alt=p.ele; } else { lat=BLAT+s.dist/111320; lon=BLON; alt=s.alt; }
    u8(1); u32(toFit(s.t)); u32(Math.round(s.dist*100)); u16(Math.round((alt+500)*5)); u16(Math.round((s.spd/3.6)*1000)); u8(s.hr>0?Math.round(s.hr):0xFF); u32(sc(lat)); u32(sc(lon)); }
  def(2,19,[[253,4,0x86],[2,4,0x86],[7,4,0x86],[8,4,0x86],[9,4,0x86],[21,2,0x84]]);
  u8(2); u32(t1); u32(t0); u32(totalSec*1000); u32(totalSec*1000); u32(Math.round(td*100)); u16(asc);
  def(3,18,[[253,4,0x86],[2,4,0x86],[7,4,0x86],[8,4,0x86],[9,4,0x86],[22,2,0x84],[5,1,0x00],[6,1,0x00],[26,2,0x84],[25,2,0x84]]);
  u8(3); u32(t1); u32(t0); u32(totalSec*1000); u32(totalSec*1000); u32(Math.round(td*100)); u16(asc); u8(1); u8(real?0:58); u16(1); u16(0);
  def(4,34,[[253,4,0x86],[0,4,0x86],[1,2,0x84],[2,1,0x00],[3,1,0x00],[4,1,0x00]]);
  u8(4); u32(t1); u32(totalSec*1000); u16(1); u8(0); u8(26); u8(1);
  const h=[14,0x20,2140&0xFF,(2140>>8)&0xFF,D.length&0xFF,(D.length>>8)&0xFF,(D.length>>16)&0xFF,(D.length>>24)&0xFF,0x2E,0x46,0x49,0x54];
  const hc=fitCRC(h.slice(0,12)); h.push(hc&0xFF,(hc>>8)&0xFF); const body=h.concat(D), fc=fitCRC(body);
  return new Uint8Array(body.concat([fc&0xFF,(fc>>8)&0xFF])); }

// ---------- import GPX ----------
function haversine(a,b){ const R=6371000, r=x=>x*Math.PI/180, dLat=r(b.lat-a.lat), dLon=r(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
async function onGpx(e){ const file=e.target.files&&e.target.files[0]; if(!file) return;
  try{
    const doc=new DOMParser().parseFromString(await file.text(),'application/xml');
    if(doc.querySelector('parsererror')) throw new Error('fichier illisible');
    let raw=[...doc.getElementsByTagName('trkpt')]; if(raw.length<2) raw=[...doc.getElementsByTagName('rtept')]; if(raw.length<2) raw=[...doc.getElementsByTagName('wpt')];
    const pts=raw.map(p=>({lat:parseFloat(p.getAttribute('lat')), lon:parseFloat(p.getAttribute('lon')),
      ele:parseFloat(p.getElementsByTagName('ele')[0]&&p.getElementsByTagName('ele')[0].textContent),
      time:p.getElementsByTagName('time')[0]&&p.getElementsByTagName('time')[0].textContent}));
    if(pts.length<2) throw new Error('aucun point exploitable');
    if(!pts.every(p=>!isNaN(p.ele))) throw new Error('altitude manquante sur certains points');
    const hasTime=pts.every(p=>p.time);
    let cum=0; pts[0].d=0; for(let i=1;i<pts.length;i++){ cum+=haversine(pts[i-1],pts[i]); pts[i].d=cum; }
    const segs=[]; let start=0;
    while(start<pts.length-1){ let end=start; while(end<pts.length-1 && pts[end].d-pts[start].d<GPX_SEG) end++;
      const sd=pts[end].d-pts[start].d; if(sd<=0){ start=end+1; continue; }
      let grade=clamp((pts[end].ele-pts[start].ele)/sd*100,0,15), spd=null;
      if(hasTime){ const dt=(new Date(pts[end].time)-new Date(pts[start].time))/1000; if(dt>0) spd=clamp(sd/dt*3.6,1,18); }
      segs.push({d0:pts[start].d,d1:pts[end].d,grade:+grade.toFixed(1),spd:spd!=null?+spd.toFixed(1):null}); start=end; }
    let dplus=0; for(let i=1;i<pts.length;i++){ const dz=pts[i].ele-pts[i-1].ele; if(dz>0) dplus+=dz; }
    const sess={id:'g'+Date.now(), type:'gpx', name:file.name.replace(/\.gpx$/i,''), hasTime, totalDist:Math.round(cum), totalDplus:Math.round(dplus), segs,
      track:pts.map(p=>({d:+p.d.toFixed(1),lat:p.lat,lon:p.lon,ele:+p.ele.toFixed(1)}))};
    st.sessions=st.sessions.concat([sess]); persist('tm_sessions',st.sessions);
    st.msg='Importé : '+(cum/1000).toFixed(2)+' km · '+Math.round(dplus)+' m D+'+(hasTime?' · allure incluse':' · profil seul'); st.msgColor=ACC; render();
  }catch(err){ st.msg='GPX : '+err.message; st.msgColor='#FF7A6B'; render(); }
  e.target.value=''; }

// ---------- graphes ----------
function gpxBars(sess, coveredM){ const N=26, per=sess.totalDist/N, cur=Math.floor(clamp(coveredM,0,sess.totalDist-1)/per);
  let ele=0; const raw=[]; for(let i=0;i<N;i++){ const d=i*per, s=segAtDist(sess,d); ele+=s.grade/100*per; raw.push(ele); }
  const max=Math.max(1,...raw); return raw.map((v,i)=>({h:Math.max(6,Math.round(v/max*100))+'%', color:i<cur?PAST:(i===cur?ACC:DIM)})); }
function gradeBars(grades){ const N=26, arr=grades.slice(-N), max=Math.max(4,...arr,1), out=[];
  for(let i=0;i<N-arr.length;i++) out.push({h:'6%', color:DIM});
  arr.forEach((g,i)=>out.push({h:Math.max(6,Math.round(g/max*100))+'%', color:i===arr.length-1?ACC:PAST})); return out; }
function intervalBars(segs, idx){ return segs.map((s,i)=>({flex:Math.max(1,Math.round(s.dur/10)), h:Math.max(14,Math.round(s.spd/18*100))+'%', color:i<idx?PAST:(i===idx?ACC:DIM)})); }
function barsHtml(bars){ return bars.map(b=>'<div style="flex:'+(b.flex||1)+';min-width:2px;border-radius:1px 1px 0 0;background:'+b.color+';height:'+b.h+'"></div>').join(''); }

// ---------- boucle 1 Hz ----------
function tick(){
  if(!st.connected) return;
  const speed=st.speed;
  if(speed>0){ const m=speed/3.6; st.dist+=m; st.dplus+=(curGrade>0?m*curGrade/100:0); st.elapsed+=1;
    rec.push({t:new Date().toISOString(), dist:st.dist, spd:speed, alt:st.dplus, hr:st.hr||0});
    st.grades.push(st.incT); if(st.grades.length>26) st.grades.shift(); }
  playAdvance();
  if(st.view==='drive'||st.view==='play') render();
}
function playAdvance(){ const play=st.play; if(!play||play.paused) return;
  if(!play.started && st.speed>0) play.started=true;
  if(play.type==='interval'){ const segs=play.session.segments, seg=segs[play.idx];
    if(play.started && st.speed>0) play.segElapsed=(play.segElapsed||0)+1;
    if(play.segElapsed>=seg.dur){ if(play.idx+1>=segs.length){ doStop(); return; } play.idx++; play.segElapsed=0; }
    const cur=segs[play.idx]; applyTargets(cur.spd,cur.inc);
  }else{ const sess=play.session, seg=segAtDist(sess,st.dist);
    if(play.started && st.dist>=sess.totalDist){ doStop(); return; }
    applyTargets(play.mode==='gpx' && seg.spd!=null ? seg.spd : null, seg.grade); }
}
function applyTargets(spd,inc){ if(spd!=null && Math.abs(spd-st.spdT)>0.05){ st.spdT=spd; sendSpeed(spd); }
  if(inc!=null && Math.abs(inc-st.incT)>0.15){ st.incT=+inc.toFixed(1); sendIncline(inc); } }

// ---------- navigation ----------
function go(v){ st.view=v; if(v==='sessions') st.msg=''; render(); }
function openSheet(){ st.sheet=true; render(); }
function closeSheet(){ st.sheet=false; render(); }
function playPause(){ if(st.play){ st.play.paused=!st.play.paused; render(); } }

// ---------- rendu ----------
function render(){
  const s=st, play=s.play, running=s.speed>0;
  const dotColor=(s.connected||s.hrOn)?ACC:'#4c5142';
  const linkLabel=s.connected?(s.hrOn?'Tapis · FC':'Tapis'):'Hors ligne';
  let html='';
  // header
  html+='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px">'+
    '<div style="font:700 13px Barlow;letter-spacing:.14em;color:#8A8F80">THREADMILL</div>'+
    '<button onclick="openSheet()" style="display:flex;align-items:center;gap:8px;background:#191b18;border:1px solid #26291f;border-radius:99px;padding:6px 12px">'+
    '<span style="width:7px;height:7px;border-radius:99px;background:'+dotColor+'"></span>'+
    '<span style="font:600 12.5px Barlow;color:#C3C8B8">'+linkLabel+'</span></button></div>';

  if(s.view==='drive') html+=viewDrive();
  else if(s.view==='sessions') html+=viewSessions();
  else if(s.view==='build') html+=viewBuild();

  if(s.view!=='play'){
    const t=v=>v?ACC:'#8A8F80';
    html+='<div style="position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #23261e;background:#0c0d0c;padding:9px 10px 18px">'+
      '<button onclick="go(\'drive\')" style="background:transparent;padding:6px 0;font:600 12.5px Barlow;letter-spacing:.04em;color:'+t(s.view==='drive')+'">Pilotage</button>'+
      '<button onclick="go(\'sessions\')" style="background:transparent;padding:6px 0;font:600 12.5px Barlow;letter-spacing:.04em;color:'+t(s.view==='sessions'||s.view==='build')+'">Séances</button>'+
      '<button onclick="go(\'history\')" style="background:transparent;padding:6px 0;font:600 12.5px Barlow;letter-spacing:.04em;color:'+t(s.view==='history')+'">Historique</button></div>';
  }
  if(s.sheet) html+=viewSheet();
  document.getElementById('app').innerHTML=html;
}

    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px"><span style="font:600 11.5px Barlow;letter-spacing:.12em;color:#8A8F80">'+block+'</span><span style="font:600 13px Barlow;color:#C3C8B8">'+rem+'</span></div>'+
    '<div style="display:flex;align-items:flex-end;gap:2px;height:70px">'+barsHtml(bars)+'</div>'+
    '<div style="height:3px;background:#23261e;border-radius:2px;margin-top:10px;display:flex"><div style="background:#CBF24E;border-radius:2px;width:'+prog+'"></div></div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:8px"><span style="font:500 12px Barlow;color:#6d7264">'+tot+'</span><span style="font:500 12px Barlow;color:#6d7264">'+next+'</span></div></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 18px 0">'+
    '<div style="background:#191b18;border:1px solid #26291f;border-radius:16px;padding:11px 13px"><div style="font:600 10.5px Barlow;letter-spacing:.12em;color:#8A8F80">ALLURE CIBLE</div><div style="font:600 42px \'Barlow Condensed\';line-height:1;color:#CBF24E;font-variant-numeric:tabular-nums">'+pSpd+'</div></div>'+
    '<div style="background:#191b18;border:1px solid #26291f;border-radius:16px;padding:11px 13px"><div style="font:600 10.5px Barlow;letter-spacing:.12em;color:#8A8F80">PENTE CIBLE</div><div style="font:600 42px \'Barlow Condensed\';line-height:1;color:#CBF24E;font-variant-numeric:tabular-nums">'+pInc+'</div></div></div>'+
    '<div style="text-align:center;padding:14px 20px 0"><div style="display:flex;align-items:flex-start;justify-content:center;gap:8px"><span style="font:700 104px \'Barlow Condensed\';line-height:.84;font-variant-numeric:tabular-nums">'+s.speed.toFixed(1)+'</span><span style="font:600 16px Barlow;color:#8A8F80;margin-top:12px">km/h réels</span></div></div>'+
    statBar(29)+'<div style="flex:1;min-height:12px"></div>';
  if(play.type==='gpx' && play.mode==='free') h+='<div style="display:flex;align-items:center;gap:10px;margin:0 18px 10px;background:#191b18;border:1px solid #26291f;border-radius:20px;padding:12px">'+
    '<button class="stepbtn" onclick="adjSpd(-'+STEP+')" style="width:74px;height:62px;background:#23261e;border-radius:14px;font:400 28px Barlow;color:#CBF24E">−</button>'+
    '<div style="flex:1;text-align:center"><div style="font:600 42px \'Barlow Condensed\';line-height:.9;color:#CBF24E;font-variant-numeric:tabular-nums">'+s.spdT.toFixed(1)+'</div><div style="font:600 10px Barlow;letter-spacing:.12em;color:#8A8F80">ALLURE LIBRE KM/H</div></div>'+
    '<button class="stepbtn" onclick="adjSpd('+STEP+')" style="width:74px;height:62px;background:#CBF24E;border-radius:14px;font:400 28px Barlow;color:#14170a">+</button></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 14px">'+
    '<button onclick="playPause()" style="background:#23261e;border-radius:16px;padding:15px;font:600 15px Barlow;color:#F2F4EE">'+(play.paused?'Reprendre':'Pause')+'</button>'+
    '<button onclick="doStop()" style="background:transparent;border:1px solid #4a2f2b;border-radius:16px;padding:15px;font:600 15px Barlow;color:#FF7A6B">Terminer</button></div></div>';
  return h; }

function viewSheet(){ const s=st, hrLive=s.hrOn&&s.hr>=0;
  return '<div style="position:absolute;inset:0;background:rgba(7,8,7,.72);display:flex;align-items:flex-end;z-index:20" onclick="if(event.target===this)closeSheet()">'+
    '<div style="width:100%;background:#161816;border-top:1px solid #26291f;border-radius:26px 26px 0 0;padding:18px 18px 24px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div style="font:600 19px Barlow">Appareils</div><button onclick="closeSheet()" style="background:transparent;font:500 22px Barlow;color:#8A8F80;line-height:1">×</button></div>'+
    '<div style="display:flex;align-items:center;gap:12px;background:#191b18;border:1px solid #26291f;border-radius:16px;padding:13px 14px;margin-bottom:8px">'+
    '<span style="width:9px;height:9px;border-radius:99px;background:'+(s.connected?ACC:'#4c5142')+'"></span>'+
    '<div style="flex:1;min-width:0"><div style="font:600 14.5px Barlow">Tapis roulant</div><div style="font:500 12px Barlow;color:#8A8F80">'+(s.connected?'Connecté en FTMS':'Aucun tapis appairé')+'</div></div>'+
    '<button onclick="'+(s.connected?'disconnect()':'connect()')+'" style="background:'+(s.connected?'#23261e':ACC)+';border-radius:11px;padding:10px 14px;font:600 13px Barlow;color:'+(s.connected?'#FF7A6B':'#14170a')+'">'+(s.connected?'Couper':'Connecter')+'</button></div>'+
    '<div style="display:flex;align-items:center;gap:12px;background:#191b18;border:1px solid #26291f;border-radius:16px;padding:13px 14px;margin-bottom:14px">'+
    '<span style="width:9px;height:9px;border-radius:99px;background:'+(hrLive?'#FF7A6B':'#4c5142')+'"></span>'+
    '<div style="flex:1;min-width:0"><div style="font:600 14.5px Barlow">Ceinture cardio</div><div style="font:500 12px Barlow;color:#8A8F80">'+(hrLive?(s.hr>0?s.hr+' bpm':'Connectée'):'Optionnelle · Bluetooth')+'</div></div>'+
    '<button onclick="pairHr()" style="background:#23261e;border-radius:11px;padding:10px 14px;font:600 13px Barlow;color:#C3C8B8">'+(hrLive?'Réappairer':'Appairer')+'</button></div>'+
    '<div style="font:500 12px Barlow;color:#6d7264;line-height:1.5">Le démarrage de la courroie reste sur le bouton physique du tapis. L\'app pilote l\'allure et la pente, et enregistre la course.</div></div></div>'; }

document.addEventListener('visibilitychange', async ()=>{ if(document.visibilityState==='visible' && st.connected){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} } });
document.getElementById('gpxFile').addEventListener('change', onGpx);
st.sessions=loadLS('tm_sessions'); st.history=loadLS('tm_history');
setInterval(tick,1000);
render();
</script>
